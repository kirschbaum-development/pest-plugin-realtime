<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pest Realtime Fixture</title>
    </head>
    <body>
        <script src="/node_modules/pusher-js/dist/web/pusher-with-encryption.js"></script>
        <script src="/node_modules/laravel-echo/dist/echo.iife.js"></script>
        <script>
            const received = [];
            const transitions = [];
            const namedTransitions = [];

            window.fixtureEcho = new Echo.default({
                broadcaster: 'reverb',
                key: 'pest-realtime-fixture',
                Pusher: window.Pusher,
                wsHost: '127.0.0.1',
                wsPort: 65535,
                wssPort: 65535,
                forceTLS: false,
                enabledTransports: ['ws'],
                disableStats: true,
                authorizer: () => ({
                    authorize: (_socketId, callback) => callback(null, {
                        auth: 'fixture',
                        channel_data: JSON.stringify({
                            user_id: '1',
                            user_info: { name: 'Fixture User' },
                        }),
                    }),
                }),
            });

            const listen = (channel, name) => channel.listen('.price.changed', (payload) => {
                received.push({ channel: name, event: 'price.changed', payload });
            });

            listen(window.fixtureEcho.channel('auctions.1'), 'auctions.1');
            listen(window.fixtureEcho.private('buyers.2'), 'private-buyers.2');
            const whispered = [];
            const errors = [];

            window.fixtureEcho
                .private('buyers.2')
                .listenForWhisper('typing', (payload) => whispered.push(payload))
                .error((error) => errors.push(error));

            const presence = { here: [], joining: [], leaving: [] };
            const room = window.fixtureEcho.join('room.3');

            listen(room, 'presence-room.3');

            // Pusher hands the same member object to joining and leaving, and the
            // browser bridge serializes a repeated reference as {ref}. Snapshot it.
            room.here((users) => presence.here.push(users.map((user) => ({ ...user }))))
                .joining((user) => presence.joining.push({ ...user }))
                .leaving((user) => presence.leaving.push({ ...user }));
            listen(window.fixtureEcho.encryptedPrivate('vault.5'), 'private-encrypted-vault.5');

            const connection = window.fixtureEcho.connector.pusher.connection;

            connection.bind('state_change', (transition) => transitions.push(transition));

            for (const state of [
                'initialized',
                'connecting',
                'connected',
                'unavailable',
                'failed',
                'disconnected',
            ]) {
                connection.bind(state, () => namedTransitions.push(state));
            }

            window.__realRealtime = {
                connection,
                errors,
                namedTransitions,
                presence,
                received,
                transitions,
                whispered,
            };
        </script>
    </body>
</html>
