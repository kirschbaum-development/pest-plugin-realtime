name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pest 5 requires PHP 8.4, so 8.3 resolves to Pest 4 and the rest to
        # Pest 5. The extra entry covers Pest 4 on a PHP version that could
        # otherwise take Pest 5, which is a common spot mid-upgrade.
        php: ['8.3', '8.4', '8.5']
        pest: ['']
        include:
          - php: '8.4'
            pest: '^4.7'

    name: PHP ${{ matrix.php }}${{ matrix.pest && ' / Pest 4' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install PHP dependencies
        run: composer update --prefer-stable --no-interaction --no-progress --ansi ${{ matrix.pest && format('--with pestphp/pest:{0}', matrix.pest) || '' }}

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests
        run: composer test:unit
